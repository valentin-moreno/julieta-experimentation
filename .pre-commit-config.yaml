repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Segunda capa de defensa además de la disciplina humana — ver
  # docs/architecture/data-governance.md. Excluye tests/: sus fixtures
  # necesitan contener ejemplos de patrones "malos" a propósito.
  - repo: local
    hooks:
      - id: scan-sensitive-data
        name: Buscar patrones de datos sensibles
        entry: uv run julieta-scan-sensitive
        language: system
        exclude: ^tests/
