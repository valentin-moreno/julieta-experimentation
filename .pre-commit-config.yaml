repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Segunda capa de defensa además de la disciplina humana — ver
  # docs/architecture/data_governance.md. Excluye tests/: sus fixtures
  # necesitan contener ejemplos de patrones "malos" a propósito. También
  # excluye los archivos portados tal cual de julieta-models (ver ADR 0010):
  # una de las palabras de SENSITIVE_KEYWORD_PATTERNS aparece ahí como
  # vocabulario de dominio en comentarios/nombres de función, no como un dato
  # real (permitido-datos-sensibles), y tocarlos para silenciar el falso
  # positivo rompería la fidelidad al original que es el punto de portarlos así.
  - repo: local
    hooks:
      - id: scan-sensitive-data
        name: Buscar patrones de datos sensibles
        entry: uv run julieta_scan_sensitive
        language: system
        exclude: ^tests/|^pipelines/data/build_training_dataset\.py$|^src/julieta/data/(make_dataset|databases)\.py$|^src/julieta/visualization/visualize\.py$
