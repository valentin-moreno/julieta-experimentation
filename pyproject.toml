[project]
name = "julieta"
version = "0.1.0"
description = "Repositorio de experimentacion ML de Julieta, organizado con practicas MLOps."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "mlflow>=2.16",
    "azureml-mlflow>=1.57",
    "dvc[azure]>=3.51",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "sklearn-genetic-opt>=0.11",
    "umap-learn>=0.5",
    "python-dotenv>=1.0",
    "h5py>=3.12",
    "azure-storage-blob>=12.27",
    "requests>=2.32",
]

[project.scripts]
julieta_summary = "julieta.utils.generate_summary:main"
julieta_validate = "julieta.utils.validate_metadata:main"
julieta_assign_ids = "julieta.utils.assign_experiment_ids:main"
julieta_report = "julieta.utils.generate_experiment_report:main"
julieta_scan_sensitive = "julieta.utils.scan_sensitive_data:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/julieta"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
