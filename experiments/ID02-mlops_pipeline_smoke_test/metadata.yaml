# Objetivo y Resultados
objective: "Validar de punta a punta el pipeline de MLOps del repo (DVC, MLflow, metadata, resumen de experimentos) con un dataset sintético, sin depender de que exista todavía un experimento de negocio real."
conclusion: "Pipeline completo funcionando de punta a punta: dvc add/push subió el dataset sintético al remote de Azure Blob, log_run dejó un run real (FINISHED, nombrado 'baseline' en vez del nombre random que asigna MLflow por default) en el workspace ml-salva-dev — experimento 'julieta/ID02-mlops_pipeline_smoke_test', run_id 6d95d186-77f5-436d-adf6-140d0ccbc6a2 — con 16 métricas (8 train + 8 test, incluyendo accuracy y julieta_score), 4 artifacts (confusion matrix y classification report de train y de test), y un reports/report.html autogenerado. julieta-validate/julieta-summary reconocen el experimento sin ajustes. test_roc_auc 0.94 supera el target de 0.85; train_roc_auc 1.0 vs test 0.94 muestra overfitting esperable con XGBoost sin tuning sobre un dataset sintético fácil de separar — no es un problema a resolver aquí, es la clase de señal que este pipeline ya deja ver. Nota: hay 2 runs anteriores en el mismo experimento de Azure ML (iteraciones previas de este mismo smoke test) que quedaron como historial, no se borraron. CI/CD (Azure Pipelines) sigue sin conectar, no se probó aquí."
