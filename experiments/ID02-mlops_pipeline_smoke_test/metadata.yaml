# Objetivo y Resultados
objective: "Validar de punta a punta el pipeline de MLOps del repo (DVC, MLflow, metadata, resumen de experimentos) con un dataset sintético, sin depender de que exista todavía un experimento de negocio real."
conclusion: "Pipeline completo funcionando de punta a punta, ahora comparando 3 clasificadores dentro del mismo experimento: xgboost (run_id d178a55d), logistic_regression (4dced268) y random_forest (c90a94ff) — cada uno su propio run FINISHED en el workspace ml-salva-dev, mismo experimento 'julieta/ID02-mlops_pipeline_smoke_test', mismo train/test split. xgboost gana con test_roc_auc 0.94 (target 0.85), random_forest 0.92, logistic_regression 0.80 — comparación creíble, no forzada. Cada run trae 16 métricas (8 train + 8 test) y 4 artifacts (confusion matrix + classification report de train/test). reports/report.html ahora tiene una sección por run, con las imágenes referenciadas por ruta relativa a results/ (no embebidas en base64 — no duplicar lo que ya vive en local y en MLflow). julieta_validate/julieta_summary reconocen el experimento (model_type ahora es lista). Bug real encontrado y corregido en el camino: julieta.tracking.mlflow_config usaba load_dotenv(), que contaminaba todo el proceso con las variables de .env — un subprocess de dvc push heredaba AZURE_STORAGE_CONNECTION_STRING (de otra cuenta) y DVC la priorizaba sobre az login, fallando con un error engañoso ('no such container'). Corregido a dotenv_values(), con test de regresión. CI/CD (Azure Pipelines) sigue sin conectar, no se probó aquí."
