# Config del smoke test — no hay tuning, es un baseline único por clasificador,
# para probar el patrón de comparar varios modelos dentro del mismo experimento
# (cada uno como su propio run en MLflow, ver README).

dataset:
  n_samples: 2000
  n_features: 12
  n_informative: 8
  n_redundant: 2
  class_weights: [0.7, 0.3]
  random_state: 42

split:
  test_size: 0.2
  stratify: true

models:
  xgboost:
    type: "BalancedXGBClassifier"
    n_estimators: 200
    max_depth: 4
    learning_rate: 0.1
    random_state: 42
    eval_metric: "logloss"
  logistic_regression:
    type: "LogisticRegression"
    max_iter: 1000
    random_state: 42
  random_forest:
    type: "RandomForestClassifier"
    n_estimators: 200
    max_depth: 6
    random_state: 42
