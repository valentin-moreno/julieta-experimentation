# Config del smoke test — no hay tuning, es un baseline único para validar el pipeline.

dataset:
  n_samples: 2000
  n_features: 12
  n_informative: 8
  n_redundant: 2
  class_weights: [0.7, 0.3]
  random_state: 42

split:
  test_size: 0.2
  stratify: true

model:
  type: "BalancedXGBClassifier"
  n_estimators: 200
  max_depth: 4
  learning_rate: 0.1
  random_state: 42
  eval_metric: "logloss"
